name: Monitor API status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check endpoints and update Gist
        env:
          PELICAN_API_KEY: ${{ secrets.PELICAN_API_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          node --input-type=commonjs <<'EOF'
          const https = require('https');

          const PANEL = 'https://panel.mccompanion.net';

          const HTTP_ENDPOINTS = [
            { name: 'EU API', group: 'api', url: 'https://api.mccompanion.net/api/featured-servers' },
          ];

          const PELICAN_SERVERS = [
            { id: 'c6a0fcad', name: 'EU Redis',          group: 'infrastructure' },
            { id: 'f176ca5a', name: 'US Redis',          group: 'infrastructure' },
            { id: 'a0a42068', name: 'EU Relay',          group: 'infrastructure' },
            { id: 'f9a27188', name: 'US Relay',          group: 'infrastructure' },
            { id: '82947325', name: 'EU API',            group: 'api'            },
            { id: '60e47e69', name: 'US API',            group: 'api'            },
            { id: 'e3b00977', name: 'EU MCCBot',         group: 'bots'           },
            { id: '72b6a16b', name: 'EU Xbox Broadcast', group: 'bots'           },
            { id: '071f1b1c', name: 'US Xbox Broadcast', group: 'bots'           },
            { id: 'fbd2e58b', name: 'EU Geyser',         group: 'bots'           },
            { id: '4b70a1de', name: 'US Geyser',         group: 'bots'           },
            { id: '8b060c22', name: 'MCC Status Bot',    group: 'bots'           },
          ];

          const MAX_HISTORY = 288;
          const PELICAN_KEY = process.env.PELICAN_API_KEY;
          const GIST_TOKEN  = process.env.GIST_TOKEN;
          const GIST_ID     = process.env.GIST_ID;

          async function checkHttp(endpoint) {
            const start = Date.now();
            try {
              const res = await fetch(endpoint.url, { signal: AbortSignal.timeout(8000) });
              return { name: endpoint.name, group: endpoint.group, status: res.status < 500 ? 'up' : 'degraded', latency_ms: Date.now() - start };
            } catch {
              return { name: endpoint.name, group: endpoint.group, status: 'down', latency_ms: null };
            }
          }

          async function checkPelican(server) {
            try {
              const res = await fetch(`${PANEL}/api/client/servers/${server.id}/resources`, {
                headers: { Authorization: `Bearer ${PELICAN_KEY}`, Accept: 'application/json' },
                signal: AbortSignal.timeout(10000),
              });
              if (!res.ok) {
                const text = await res.text().catch(() => '');
                console.error(`[${server.name}] HTTP ${res.status}: ${text.slice(0, 200)}`);
                return { name: server.name, group: server.group, status: 'unknown', latency_ms: null };
              }
              const data = await res.json();
              const state = data.attributes?.current_state ?? 'unknown';
              const status = state === 'running' ? 'up' : state === 'starting' ? 'degraded' : 'down';
              return { name: server.name, group: server.group, status, latency_ms: null, state };
            } catch (e) {
              console.error(`[${server.name}] Error: ${e.message}`);
              return { name: server.name, group: server.group, status: 'unknown', latency_ms: null };
            }
          }

          function fetchGist() {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'api.github.com',
                path: `/gists/${GIST_ID}`,
                headers: { Authorization: `Bearer ${GIST_TOKEN}`, 'User-Agent': 'MCCompanion-Monitor', Accept: 'application/vnd.github+json' },
              }, res => {
                let body = '';
                res.on('data', d => body += d);
                res.on('end', () => {
                  try {
                    const gist = JSON.parse(body);
                    const content = gist.files?.['status.json']?.content ?? '{}';
                    resolve(JSON.parse(content));
                  } catch { resolve({ services: [], history: [] }); }
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          function updateGist(content) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({ files: { 'status.json': { content: JSON.stringify(content, null, 2) } } });
              const req = https.request({
                hostname: 'api.github.com',
                path: `/gists/${GIST_ID}`,
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${GIST_TOKEN}`,
                  'User-Agent': 'MCCompanion-Monitor',
                  Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                },
              }, res => {
                res.resume();
                res.on('end', () => resolve(res.statusCode));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const now = new Date().toISOString();

            const existing = await fetchGist().catch(() => ({ services: [], history: [] }));

            const [httpResults, pelicanResults] = await Promise.all([
              Promise.all(HTTP_ENDPOINTS.map(checkHttp)),
              Promise.all(PELICAN_SERVERS.map(checkPelican)),
            ]);

            const services = [...pelicanResults, ...httpResults];
            const historyEntry = {
              timestamp: now,
              checks: services.map(s => ({ name: s.name, group: s.group, status: s.status })),
            };
            const history = [...(existing.history || []), historyEntry].slice(-MAX_HISTORY);
            const output = { updated_at: now, services, history };

            const status = await updateGist(output);
            console.log(`Gist updated (HTTP ${status}):`, services.map(s => `${s.name}=${s.status}`).join(', '));
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
